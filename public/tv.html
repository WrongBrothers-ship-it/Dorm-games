    bigText('< BACK', BACK_BTN.y + 27, 13, backOver ? '#fff' : CYAN, 'center', BACK_BTN.x + BACK_BTN.w / 2);

    MENU_ITEMS.forEach((item, i) => {
      const r = menuRect(i);
      const over = pointIn(mouse, r);
      const g = item.id === 'party' ? null : GAMES[item.id];
      panel(r.x, r.y, r.w, r.h, over ? '#ffffff' : item.color, over ? 'rgba(43,26,99,0.96)' : 'rgba(11,7,32,0.92)');
      drawIcon(item.id, r.x + r.w / 2, r.y + 16, 4);
      const name = g ? g.title : 'PARTY MODE';
      bigText(name, r.y + 86, fitSize(name, 15, r.w - 20), item.color, 'center', r.x + r.w / 2);
      wrapText(g ? g.tagline : `${PARTY_ROUNDS} random games. Most points wins!`, r.y + 108, 9, '#c8c8d8', r.w - 20, r.x + r.w / 2);
    });

    const n = Object.keys(players).length;
    bigText(n > 0 ? `${n} PLAYER${n > 1 ? 'S' : ''} IN. CLICK A GAME!` : 'NO PLAYERS YET. OPEN THE PHONE PAGE.',
      466, 12, n > 0 ? GREEN : MAGENTA);
    if (performance.now() < toast.until) bigText(toast.text, 490, 14, YELLOW);
  }

  function drawLobby(now) {
    drawArcade(now);
    titleText('DORM PARTY', 96, 54, now);
    bigText(`${PARTY_ROUNDS} ROUNDS. MOST POINTS WINS!`, 140, 13, CYAN);

    // Menu shortcut, top right
    const over = pointIn(mouse, MENU_BTN);
    panel(MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h, over ? '#fff' : MAGENTA, over ? 'rgba(74,42,138,0.95)' : 'rgba(11,7,32,0.9)');
    bigText('GAME MENU', MENU_BTN.y + 24, 11, over ? '#fff' : MAGENTA, 'center', MENU_BTN.x + MENU_BTN.w / 2);
    bigText('OR PRESS M', MENU_BTN.y + 44, 8, '#c8c8d8', 'center', MENU_BTN.x + MENU_BTN.w / 2);

    for (let slot = 0; slot < MAX_PLAYERS; slot++) {
      const p = Object.values(players).find((q) => q.slot === slot);
      const x = 26 + slot * 126, y = 172, w = 118, h = 184;
      const color = COLORS[slot];
      panel(x, y, w, h, p ? color : '#4a4a60', p ? 'rgba(11,7,32,0.93)' : 'rgba(11,7,32,0.7)');
      drawPerson(x + w / 2, y + 100, 5, color, p ? 1 : 0.25);
      bigText(`P${slot + 1}`, y + 128, 20, p ? color : '#5c5c78', 'center', x + w / 2);
      if (!p) bigText('EMPTY', y + 160, 10, '#5c5c78', 'center', x + w / 2);
      else if (p.ready) bigText('READY!', y + 162, 14, GREEN, 'center', x + w / 2);
      else bigText('JOINED', y + 160, 11, '#fff', 'center', x + w / 2);
    }

    const count = Object.keys(players).length;
    wrapText('Open the phone page, enable the gyro, then tap READY', 380, 11, '#fff', 720);
    const blink = Math.floor(now / 500) % 2 === 0;
    if (count > 0) {
      if (blink) bigText('PRESS ENTER TO START', 428, 22, GREEN);
    } else if (blink) {
      bigText('INSERT COIN', 428, 26, YELLOW);
    }
    bigText('1 TO 6 PLAYERS', 470, 10, '#c8c8d8');
  }

  function drawIntro(now) {
    drawArcade(now);
    shade(0.35);
    bigText(`ROUND ${round + 1} OF ${order.length}`, 60, 18, CYAN);
    titleText(game.title, 140, 50, now);
    wrapText(game.tagline, 196, 14, '#fff', 700);

    panel(100, 240, 600, 112, MAGENTA);
    bigText('HOW TO PLAY', 268, 11, MAGENTA);
    wrapText(game.controls, 296, 12, '#fff', 540);

    bigText('PHONE BUTTON', 384, 10, '#c8c8d8');
    panel(CX - 110, 396, 220, 52, GREEN);
    bigText(game.button, 430, 20, GREEN);
    bigText('PRESS ENTER TO SKIP', 480, 9, '#c8c8d8');
  }

  function drawScoreRows(rows, y0) {
    if (rows[0] && rows[0].points !== undefined) bigText('PTS', y0 - 40, 10, '#c8c8d8', 'right', 620);
    bigText('TOTAL', y0 - 40, 10, '#c8c8d8', 'right', 716);
    rows.forEach((r, i) => {
      const y = y0 + i * (rows.length > 4 ? 44 : 56);
      const color = COLORS[r.p.slot];
      panel(88, y - 32, 640, rows.length > 4 ? 38 : 48, color, 'rgba(11,7,32,0.93)');
      bigText(`${ordinal(i + 1)}`, y, 18, '#fff', 'left', 108);
      bigText(`P${r.p.slot + 1}`, y, 20, color, 'left', 196);
      if (r.label) bigText(r.label, y, 12, '#c8c8d8', 'right', 530);
      if (r.points !== undefined) bigText(`+${r.points}`, y, 18, GREEN, 'right', 620);
      bigText(`${r.p.score}`, y, 20, YELLOW, 'right', 708);
    });
  }

  function drawRoundEnd(now) {
    drawArcade(now);
    shade(0.5);
    titleText(`${game.title}`, 70, 30, now);
    bigText('RESULTS', 108, 14, CYAN);
    drawScoreRows(roundResults, roundResults.length > 4 ? 178 : 190);
    const last = round + 1 >= order.length;
    if (Math.floor(now / 500) % 2 === 0) {
      const text = !last ? 'ENTER FOR NEXT GAME' : single ? 'ENTER FOR THE MENU' : 'ENTER FOR FINAL SCORES';
      bigText(text, 474, 16, GREEN);
    }
  }

  function drawFinal(now) {
    drawArcade(now);
    shade(0.45);
    const rows = active().sort((a, b) => b.score - a.score).map((p) => ({ p, label: '' }));
    const top = rows[0].p.score;
    const winners = rows.filter((r) => r.p.score === top);
    const winText = winners.length > 1
      ? `TIE: ${winners.map((w) => 'P' + (w.p.slot + 1)).join(' & ')}!`
      : `PLAYER ${winners[0].p.slot + 1} WINS!`;
    titleText(winText, 84, 38, now);
    bigText('FINAL SCORES', 124, 13, CYAN);
    drawScoreRows(rows, rows.length > 4 ? 206 : 214);
    if (Math.floor(now / 500) % 2 === 0) bigText('PRESS ENTER TO PLAY AGAIN', 474, 16, GREEN);
  }

  function render(now) {
    tctx.clearRect(0, 0, W, H);

    if (phase === 'lobby') drawLobby(now);
    else if (phase === 'menu') drawMenu(now);
    else if (phase === 'intro') drawIntro(now);
    else if (phase === 'final') drawFinal(now);
    else if (phase === 'roundEnd') drawRoundEnd(now);
    else {
      const t = Math.max(0, (now - playStart) / 1000);
      game.draw(now, t);
      bigText(single ? 'SINGLE GAME  (ESC = EXIT)' : `ROUND ${round + 1}/${order.length}`, H - 10, 9, '#c8c8d8', 'left', 12);

      if (phase === 'countdown') {
        shade(0.35);
        const left = COUNTDOWN_SECONDS - Math.floor((now - phaseStart) / 1000);
        bigText(String(Math.max(1, left)), 310, 150, YELLOW);
      } else if (t < 1) {
        bigText('GO!', 310, 150, GREEN);
      }
    }
  }

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    update(now, dt);
    render(now);
    present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') advance();
    else if ((e.key === 'm' || e.key === 'M') && phase === 'lobby') toMenu();
    else if (e.key === 'Escape' && phase !== 'lobby') toLobby();
    else if (phase === 'menu' && e.key >= '1' && e.key <= String(MENU_ITEMS.length)) {
      runAction({ act: 'pick', id: MENU_ITEMS[Number(e.key) - 1].id });
    }
  });

  const canvasPoint = (e) => {
    const r = display.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
  };
  display.addEventListener('mousemove', (e) => {
    mouse = canvasPoint(e);
    display.style.cursor = hitTarget(mouse) ? 'pointer' : 'default';
  });
  display.addEventListener('mouseleave', () => { mouse = { x: -1, y: -1 }; });
  display.addEventListener('click', (e) => runAction(hitTarget(canvasPoint(e))));

  // ------------------------------------------------------- phone messages

  function handleMessage(p, e) {
    const msg = JSON.parse(e.data);

    if (msg.type === 'gyro') {
      // Raw tilt, used by games that read the phone's angle
      p.input.beta = msg.x;
      p.input.gamma = msg.y;
      p.input.wheel = msg.wheel;
      // Steering-wheel angle if the phone sent one, otherwise sideways tilt
      const angle = msg.wheel === null || msg.wheel === undefined ? msg.y : msg.wheel;
      p.input.steer = Math.abs(angle) < 4 ? 0 : clamp(angle / 40, -1, 1);
    }

    if (msg.type === 'flick' && phase === 'play' && p.active && game.onFlick) {
      game.onFlick(p, msg.peak);
    }

    if (msg.type === 'shake' && phase === 'play' && p.active && game.onShake) {
      game.onShake(p, msg.amount);
    }

    if (msg.type === 'button') {
      const down = msg.state === 'down';
      p.input.gas = down;
      // In the lobby, the button is the ready button
      if (down && phase === 'lobby') {
        p.ready = !p.ready;
        sendPhase(p);
      }
      if (phase === 'play' && p.active && game.onButton) game.onButton(p, down);
    }
  }

  // ----------------------------------------------------------- signaling

  // Create a fresh peer connection for one phone. The TV creates the data
  // channel before making the offer so it is included in the SDP.
  function createPeer(phoneId, p) {
    if (p.pc) p.pc.close();
    lastConnId += 1;
    const id = lastConnId;
    p.connId = id;
    p.remoteSet = false;
    p.pendingCandidates = [];

    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    p.pc = pc;
    const label = `player ${p.slot + 1}`;

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        ws.send(JSON.stringify({ type: 'candidate', to: phoneId, connId: id, candidate: e.candidate }));
      }
    };

    pc.onconnectionstatechange = () => {
      console.log(`${label} connectionState: ${pc.connectionState}`);
      if (players[phoneId] !== p) return;
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') removePlayer(phoneId);
      else updateDebug(`${label}: ${pc.connectionState}`);
    };

    pc.oniceconnectionstatechange = () => {
      console.log(`${label} iceConnectionState: ${pc.iceConnectionState}`);
    };

    const channel = pc.createDataChannel('game-inputs');
    p.channel = channel;
    channel.onopen = () => {
      sendTo(p, { type: 'assign', slot: p.slot, color: COLORS[p.slot] });
      sendPhase(p);
      updateDebug(`${label} connected`);
    };
    channel.onclose = () => {
      if (players[phoneId] === p && p.pc === pc) removePlayer(phoneId);
    };
    channel.onmessage = (e) => handleMessage(p, e);
  }

  async function sendOffer(phoneId, p) {
    createPeer(phoneId, p);
    const id = p.connId;
    const pc = p.pc;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', to: phoneId, connId: id, sdp: pc.localDescription }));
  }

  ws.onmessage = async (msg) => {
    const data = JSON.parse(msg.data);
    const phoneId = data.phoneId;
    if (!phoneId) return;

    if (data.type === 'ready') {
      // A phone repeats "ready" until it gets an offer. Ignore those repeats
      // while its connection is still being set up or is live.
      const existing = players[phoneId];
      if (existing && existing.pc.connectionState !== 'failed' && existing.pc.connectionState !== 'closed') return;
      if (existing) removePlayer(phoneId);

      const slot = freeSlot();
      if (slot === -1) {
        ws.send(JSON.stringify({ type: 'full', to: phoneId }));
        return;
      }

      const p = {
        slot, pc: null, channel: null, connId: 0, remoteSet: false, pendingCandidates: [],
        input: { steer: 0, gas: false, beta: 0, gamma: 0, wheel: null },
        ready: false, active: false, score: 0,
      };
      players[phoneId] = p;
      updateDebug(`player ${slot + 1} connecting...`);
      await sendOffer(phoneId, p);
      return;
    }

    const p = players[phoneId];
    if (!p || data.connId !== p.connId) return;

    if (data.type === 'answer') {
      if (p.pc.signalingState !== 'have-local-offer') return;
      await p.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      p.remoteSet = true;
      for (const c of p.pendingCandidates) await p.pc.addIceCandidate(c);
      p.pendingCandidates = [];
    } else if (data.type === 'candidate') {
      const cand = new RTCIceCandidate(data.candidate);
      if (p.remoteSet) await p.pc.addIceCandidate(cand);
      else p.pendingCandidates.push(cand);
    }
  };
</script>
